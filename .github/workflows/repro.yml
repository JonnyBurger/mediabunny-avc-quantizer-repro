name: Reproduce AVC quantizer flush failure

on:
  workflow_dispatch:
  push:

jobs:
  reproduce:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - uses: oven-sh/setup-bun@v2.1.2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps
      - name: Download Chrome for Testing 150.0.7871.124
        run: |
          curl -fsSL https://storage.googleapis.com/chrome-for-testing-public/150.0.7871.124/mac-arm64/chrome-mac-arm64.zip -o "$RUNNER_TEMP/chrome.zip"
          ditto -x -k "$RUNNER_TEMP/chrome.zip" "$RUNNER_TEMP/chrome-150"
      - run: bun run repro
        env:
          CHROME_PATH: ${{ runner.temp }}/chrome-150/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing
